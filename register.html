<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrarse - SecureCam Pro</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/auth.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="light-mode">
    <div class="auth-container">
        <a href="index.html" class="back-link">
            <i data-lucide="arrow-left"></i>
            Volver al inicio
        </a>

        <div class="logo-container">
            <i data-lucide="shield" class="logo-icon"></i>
            <span class="logo-text">SecureCam Pro</span>
        </div>

        <div class="auth-card">
            <div class="auth-header">
                <h1 class="auth-title">Crear cuenta</h1>
                <p class="auth-description">Ingresa tus datos para registrarte en el sistema</p>
            </div>
            <div class="auth-content">
                <form class="auth-form">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="firstName">Nombre</label>
                            <input type="text" id="firstName" placeholder="Juan" required>
                        </div>
                        <div class="form-group">
                            <label for="lastName">Apellido</label>
                            <input type="text" id="lastName" placeholder="Pérez" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="email">Correo electrónico</label>
                        <input type="email" id="email" placeholder="ejemplo@correo.com" required>
                    </div>
                    <div class="form-group">
                        <label for="password">Contraseña</label>
                        <input type="password" id="password" placeholder="••••••••" required>
                    </div>
                    <div class="form-group">
                        <label for="confirmPassword">Confirmar contraseña</label>
                        <input type="password" id="confirmPassword" placeholder="••••••••" required>
                    </div>
                    <div class="form-checkbox">
                        <input type="checkbox" id="terms" required>
                        <label for="terms">
                            Acepto los <a href="terms.html">términos y condiciones</a>
                        </label>
                    </div>
                    <button type="submit" class="btn btn-primary btn-full">Crear cuenta</button>
                </form>
            </div>
            <div class="auth-footer">
                <div class="auth-register">
                    <span class="text-muted">¿Ya tienes una cuenta?</span>
                    <a href="login.html">Inicia sesión</a>
                </div>
                <div class="auth-divider">
                    <span>O regístrate con</span>
                </div>
                <div class="social-buttons">
                    <button class="btn btn-outline">Google</button>
                    <button class="btn btn-outline">Microsoft</button>
                </div>
            </div>
        </div>
    </div>

    <script src="js/theme.js"></script>
    <script>
        // Initialize Lucide icons
        lucide.createIcons();
        
        // Form submission
        document.querySelector('.auth-form').addEventListener('submit', function(e) {
            e.preventDefault();
            window.location.href = 'dashboard.html';
        });
    </script>
</body>
</html>
