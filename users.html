<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Usuarios - Panel de Seguridad</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/users.css">
    <script src="https://unpkg.com/feather-icons"></script>
</head>
<body class="bg-gray-100 dark:bg-gray-900">
    <div class="flex h-screen">
        <!-- Sidebar -->
        <div id="sidebar" class="sidebar">
            <!-- El contenido del sidebar se cargará mediante JavaScript -->
        </div>

        <div class="flex-1 flex flex-col overflow-hidden">
            <!-- Header -->
            <header id="header" class="header">
                <!-- El contenido del header se cargará mediante JavaScript -->
            </header>

            <!-- Main Content -->
            <main class="flex-1 overflow-y-auto p-4 md:p-6">
                <div class="max-w-6xl mx-auto">
                    <div class="flex items-center justify-between mb-6">
                        <h1 class="text-2xl font-bold text-gray-900 dark:text-white">Gestión de Usuarios</h1>
                        <button id="add-user-btn" class="btn-primary">
                            <i data-feather="user-plus" class="w-4 h-4 mr-2"></i>
                            Agregar Usuario
                        </button>
                    </div>
                    
                    <div class="bg-white dark:bg-gray-800 rounded-lg shadow overflow-hidden">
                        <div class="p-4 border-b border-gray-200 dark:border-gray-700 flex flex-col md:flex-row md:items-center md:justify-between space-y-3 md:space-y-0">
                            <div class="flex items-center space-x-2">
                                <div class="relative">
                                    <input type="text" id="search-users" class="form-input pl-9" placeholder="Buscar usuarios...">
                                    <i data-feather="search" class="w-4 h-4 text-gray-400 absolute left-3 top-1/2 transform -translate-y-1/2"></i>
                                </div>
                                <select id="filter-role" class="form-select">
                                    <option value="">Todos los roles</option>
                                    <option value="admin">Administrador</option>
                                    <option value="operator">Operador</option>
                                    <option value="viewer">Visualizador</option>
                                </select>
                            </div>
                            <div class="flex items-center space-x-2">
                                <span class="text-sm text-gray-500 dark:text-gray-400">Mostrar:</span>
                                <select id="users-per-page" class="form-select w-20">
                                    <option value="10">10</option>
                                    <option value="25">25</option>
                                    <option value="50">50</option>
                                    <option value="100">100</option>
                                </select>
                            </div>
                        </div>
                        
                        <div class="overflow-x-auto">
                            <table class="min-w-full divide-y divide-gray-200 dark:divide-gray-700">
                                <thead class="bg-gray-50 dark:bg-gray-700">
                                    <tr>
                                        <th scope="col" class="table-header">
                                            <div class="flex items-center">
                                                <input type="checkbox" id="select-all-users" class="form-checkbox">
                                            </div>
                                        </th>
                                        <th scope="col" class="table-header">
                                            <div class="flex items-center">
                                                <span>Usuario</span>
                                                <button class="sort-btn ml-1">
                                                    <i data-feather="chevron-down" class="w-4 h-4"></i>
                                                </button>
                                            </div>
                                        </th>
                                        <th scope="col" class="table-header">
                                            <div class="flex items-center">
                                                <span>Rol</span>
                                                <button class="sort-btn ml-1">
                                                    <i data-feather="chevron-down" class="w-4 h-4"></i>
                                                </button>
                                            </div>
                                        </th>
                                        <th scope="col" class="table-header">
                                            <div class="flex items-center">
                                                <span>Estado</span>
                                                <button class="sort-btn ml-1">
                                                    <i data-feather="chevron-down" class="w-4 h-4"></i>
                                                </button>
                                            </div>
                                        </th>
                                        <th scope="col" class="table-header">
                                            <div class="flex items-center">
                                                <span>Último Acceso</span>
                                                <button class="sort-btn ml-1">
                                                    <i data-feather="chevron-down" class="w-4 h-4"></i>
                                                </button>
                                            </div>
                                        </th>
                                        <th scope="col" class="table-header">
                                            <span>Acciones</span>
                                        </th>
                                    </tr>
                                </thead>
                                <tbody class="bg-white divide-y divide-gray-200 dark:bg-gray-800 dark:divide-gray-700" id="users-table-body">
                                    <!-- Los datos de los usuarios se cargarán mediante JavaScript -->
                                </tbody>
                            </table>
                        </div>
                        
                        <div class="px-4 py-3 border-t border-gray-200 dark:border-gray-700 flex flex-col md:flex-row md:items-center md:justify-between space-y-3 md:space-y-0">
                            <div class="text-sm text-gray-500 dark:text-gray-400">
                                Mostrando <span id="showing-from">1</span> a <span id="showing-to">10</span> de <span id="total-users">0</span> usuarios
                            </div>
                            <div class="flex items-center space-x-2">
                                <button id="prev-page" class="pagination-btn" disabled>
                                    <i data-feather="chevron-left" class="w-4 h-4"></i>
                                </button>
                                <div id="pagination-numbers" class="flex items-center space-x-1">
                                    <!-- Los números de página se cargarán mediante JavaScript -->
                                </div>
                                <button id="next-page" class="pagination-btn">
                                    <i data-feather="chevron-right" class="w-4 h-4"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                    
                    <div class="mt-6 flex items-center justify-between">
                        <button id="delete-selected-btn" class="btn-danger" disabled>
                            <i data-feather="trash-2" class="w-4 h-4 mr-2"></i>
                            Eliminar Seleccionados
                        </button>
                        <div class="flex items-center space-x-2">
                            <button id="export-csv-btn" class="btn-secondary">
                                <i data-feather="file-text" class="w-4 h-4 mr-2"></i>
                                Exportar CSV
                            </button>
                            <button id="export-pdf-btn" class="btn-secondary">
                                <i data-feather="file" class="w-4 h-4 mr-2"></i>
                                Exportar PDF
                            </button>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>
    
    <!-- Modal para agregar/editar usuario -->
    <div id="user-modal" class="modal hidden">
        <div class="modal-overlay"></div>
        <div class="modal-container">
            <div class="modal-header">
                <h3 id="modal-title" class="text-lg font-medium text-gray-900 dark:text-white">Agregar Usuario</h3>
                <button id="close-modal-btn" class="modal-close-btn">
                    <i data-feather="x" class="w-5 h-5"></i>
                </button>
            </div>
            <div class="modal-body">
                <form id="user-form" class="space-y-4">
                    <input type="hidden" id="user-id">
                    
                    <div class="space-y-2">
                        <label for="user-name" class="block text-sm font-medium text-gray-700 dark:text-gray-300">
                            Nombre Completo
                        </label>
                        <input type="text" id="user-name" class="form-input" required>
                    </div>
                    
                    <div class="space-y-2">
                        <label for="user-email" class="block text-sm font-medium text-gray-700 dark:text-gray-300">
                            Correo Electrónico
                        </label>
                        <input type="email" id="user-email" class="form-input" required>
                    </div>
                    
                    <div class="space-y-2">
                        <label for="user-role" class="block text-sm font-medium text-gray-700 dark:text-gray-300">
                            Rol
                        </label>
                        <select id="user-role" class="form-select" required>
                            <option value="">Seleccionar rol</option>
                            <option value="admin">Administrador</option>
                            <option value="operator">Operador</option>
                            <option value="viewer">Visualizador</option>
                        </select>
                    </div>
                    
                    <div class="space-y-2" id="password-fields">
                        <label for="user-password" class="block text-sm font-medium text-gray-700 dark:text-gray-300">
                            Contraseña
                        </label>
                        <input type="password" id="user-password" class="form-input" required>
                    </div>
                    
                    <div class="space-y-2">
                        <label for="user-status" class="block text-sm font-medium text-gray-700 dark:text-gray-300">
                            Estado
                        </label>
                        <select id="user-status" class="form-select" required>
                            <option value="active">Activo</option>
                            <option value="inactive">Inactivo</option>
                        </select>
                    </div>
                    
                    <div class="space-y-2">
                        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300">
                            Permisos
                        </label>
                        <div class="space-y-2">
                            <div class="flex items-center">
                                <input type="checkbox" id="perm-view-cameras" class="form-checkbox">
                                <label for="perm-view-cameras" class="ml-2 text-sm text-gray-700 dark:text-gray-300">
                                    Ver cámaras
                                </label>
                            </div>
                            <div class="flex items-center">
                                <input type="checkbox" id="perm-manage-cameras" class="form-checkbox">
                                <label for="perm-manage-cameras" class="ml-2 text-sm text-gray-700 dark:text-gray-300">
                                    Administrar cámaras
                                </label>
                            </div>
                            <div class="flex items-center">
                                <input type="checkbox" id="perm-view-recordings" class="form-checkbox">
                                <label for="perm-view-recordings" class="ml-2 text-sm text-gray-700 dark:text-gray-300">
                                    Ver grabaciones
                                </label>
                            </div>
                            <div class="flex items-center">
                                <input type="checkbox" id="perm-manage-users" class="form-checkbox">
                                <label for="perm-manage-users" class="ml-2 text-sm text-gray-700 dark:text-gray-300">
                                    Administrar usuarios
                                </label>
                            </div>
                            <div class="flex items-center">
                                <input type="checkbox" id="perm-system-settings" class="form-checkbox">
                                <label for="perm-system-settings" class="ml-2 text-sm text-gray-700 dark:text-gray-300">
                                    Configuración del sistema
                                </label>
                            </div>
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" id="cancel-btn" class="btn-secondary">
                    Cancelar
                </button>
                <button type="button" id="save-user-btn" class="btn-primary">
                    Guardar
                </button>
            </div>
        </div>
    </div>

    <script src="js/theme.js"></script>
    <script src="js/sidebar.js"></script>
    <script src="js/header.js"></script>
    <script src="js/users.js"></script>
</body>
</html>
